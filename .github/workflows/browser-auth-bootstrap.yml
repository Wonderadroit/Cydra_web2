name: Web2 interactive browser authentication

on:
  pull_request:
    paths:
      - "scripts/browser_auth_bootstrap.py"
      - ".github/workflows/browser-auth-bootstrap.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Authentication workflow mode"
        required: true
        default: "bootstrap"
        type: choice
        options:
          - self-test
          - bootstrap
      target_url:
        description: "Explicitly authorized target base URL"
        required: false
        default: "https://app.aurory.io"
        type: string
      auth_url:
        description: "Authentication page to open directly in the remote browser"
        required: false
        default: "https://app.aurory.io"
        type: string
      verification_paths:
        description: "Comma-separated protected/read-only application paths used to prove the session"
        required: false
        default: "/profile,/profile/inventory"
        type: string
      identity_id:
        description: "Identity label to store"
        required: false
        default: "aurory-a"
        type: string
      wait_minutes:
        description: "Minutes available to complete browser sign-in"
        required: false
        default: "15"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: live-dogfood
    env:
      CYDRA_AUTH_ENCRYPTION_KEY: ${{ secrets.CYDRA_AUTH_ENCRYPTION_KEY }}
      CYDRA_VNC_PASSWORD: ${{ secrets.CYDRA_VNC_PASSWORD }}
      CYDRA_TARGET_URL: ${{ inputs.target_url }}
      CYDRA_AUTH_URL: ${{ inputs.auth_url }}
      CYDRA_AUTH_VERIFY_PATHS: ${{ inputs.verification_paths }}
      CYDRA_AUTH_IDENTITY: ${{ inputs.identity_id }}
      CYDRA_BUG_BOUNTY_HEADER: "Bugcrowd-cyberwonder"
      CYDRA_CHROME_BINARY: "/usr/bin/google-chrome"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]"
          pip install "cryptography>=43"

      - name: Install browser and desktop bridge
        if: ${{ github.event_name == 'pull_request' || inputs.mode != 'self-test' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc openbox x11-utils
          python -m playwright install --with-deps chromium
          curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/google-chrome.deb
          sudo apt-get install -y /tmp/google-chrome.deb

      - name: Run deterministic authentication regression
        if: ${{ github.event_name == 'pull_request' || inputs.mode == 'self-test' }}
        run: python scripts/browser_auth_bootstrap.py --self-test

      - name: Validate interactive secret configuration
        if: ${{ inputs.mode == 'bootstrap' }}
        run: |
          test -n "$CYDRA_AUTH_ENCRYPTION_KEY" || (echo "CYDRA_AUTH_ENCRYPTION_KEY is required" && exit 1)
          test -n "$CYDRA_VNC_PASSWORD" || (echo "CYDRA_VNC_PASSWORD is required" && exit 1)
          if [ ${#CYDRA_VNC_PASSWORD} -ne 8 ]; then
            echo "CYDRA_VNC_PASSWORD must be exactly 8 characters because x11vnc VNC passwords are limited to 8 characters."
            echo "Update the repository/environment secret, then rerun this workflow."
            exit 1
          fi
          test -n "$CYDRA_AUTH_VERIFY_PATHS" || (echo "CYDRA_AUTH_VERIFY_PATHS is required for bootstrap" && exit 1)

      - name: Start virtual desktop
        if: ${{ inputs.mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1440x900x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          for i in $(seq 1 20); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 || { echo "Xvfb did not become ready"; cat /tmp/xvfb.log; exit 1; }

          openbox >/tmp/openbox.log 2>&1 &
          sleep 1
          x11vnc -storepasswd "$CYDRA_VNC_PASSWORD" /tmp/cydra-vnc.pass >/dev/null
          x11vnc -display "$DISPLAY" -rfbport 5900 -rfbauth /tmp/cydra-vnc.pass -forever -shared -localhost >/tmp/x11vnc.log 2>&1 &
          for i in $(seq 1 20); do
            if (echo >/dev/tcp/127.0.0.1/5900) >/dev/null 2>&1; then break; fi
            sleep 1
          done
          (echo >/dev/tcp/127.0.0.1/5900) >/dev/null 2>&1 || { echo "x11vnc did not become ready"; cat /tmp/x11vnc.log; exit 1; }

          /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 >/tmp/novnc.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null || { echo "noVNC did not become ready"; cat /tmp/novnc.log; exit 1; }

          echo "X display is healthy on $DISPLAY"
          echo "VNC backend is listening on 127.0.0.1:5900"
          echo "noVNC HTTP frontend is healthy on 127.0.0.1:6080"

      - name: Start temporary remote access tunnel
        if: ${{ inputs.mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 >/tmp/cloudflared.log 2>&1 &
          url=""
          for i in $(seq 1 30); do
            url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$url" ]; then break; fi
            sleep 2
          done
          test -n "$url" || { cat /tmp/cloudflared.log; exit 1; }
          remote_url="$url/vnc.html?autoconnect=true&resize=remote&reconnect=true&reconnect_delay=2"
          echo "REMOTE_BROWSER_URL=$remote_url"
          echo "::notice title=REMOTE BROWSER READY — OPEN THIS URL::$remote_url"
          {
            echo "## 🔐 CYDRA Remote Browser"
            echo
            echo "## **ACTION REQUIRED: TAP THE LINK BELOW ON YOUR PHONE**"
            echo
            echo "[$remote_url]($remote_url)"
            echo
            echo "Tap the link, connect to the VNC session, and sign in on the authentication page."
            echo
            echo "The link is temporary and expires when the job ends."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Remote browser is ready: $remote_url"
          echo "Open: $remote_url"
          echo "VNC password: use the exact 8-character CYDRA_VNC_PASSWORD configured for this repository/environment."

      - name: Capture interactive authentication state
        if: ${{ inputs.mode == 'bootstrap' }}
        env:
          DISPLAY: :99
          CYDRA_AUTH_WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          export CYDRA_AUTH_WAIT_SECONDS=$((CYDRA_AUTH_WAIT_MINUTES * 60))
          echo "ACTION REQUIRED: Open the REMOTE BROWSER URL from the job summary/notice."
          echo "After sign-in, CYDRA will verify the configured protected paths and observed application requests before creating encrypted state."
          python scripts/browser_auth_bootstrap.py --bootstrap

      - name: Upload encrypted authentication state
        if: ${{ inputs.mode == 'bootstrap' }}
        uses: actions/upload-artifact@v4
        with:
          name: cydra-browser-auth-${{ inputs.identity_id }}
          path: artifacts/browser-auth/*.encrypted
          retention-days: 7
          if-no-files-found: error
