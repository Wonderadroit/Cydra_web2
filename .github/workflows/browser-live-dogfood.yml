name: Web2 browser-backed live dogfood

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Explicitly authorized target base URL"
        required: true
        type: string
      discovery_seeds:
        description: "Comma-separated in-scope seed paths"
        required: false
        default: "/"
        type: string
      max_paths:
        description: "Maximum paths per identity"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  browser-live-dogfood:
    runs-on: ubuntu-latest
    environment: live-dogfood
    env:
      CYDRA_TARGET_URL: ${{ inputs.target_url }}
      CYDRA_DISCOVERY_SEEDS: ${{ inputs.discovery_seeds }}
      CYDRA_MAX_PATHS: ${{ inputs.max_paths }}
      CYDRA_SHARED_HEADERS: ${{ secrets.CYDRA_SHARED_HEADERS }}
      CYDRA_IDENTITY_HEADERS: ${{ secrets.CYDRA_IDENTITY_HEADERS }}
      CYDRA_BROWSER_STORAGE_STATES: ${{ secrets.CYDRA_BROWSER_STORAGE_STATES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[browser]"
          playwright install --with-deps chromium
      - name: Run browser-backed dogfood
        run: python scripts/browser_live_dogfood.py
      - name: Upload observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web2-browser-live-dogfood
          path: artifacts/live-browser-dogfood.json
          if-no-files-found: warn
