name: CYDRA anonymous browser origin discovery

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Explicitly authorized HTTPS target base URL"
        required: true
        type: string
      seed_path:
        description: "Root-relative page path to observe"
        required: false
        default: "/"
        type: string
      wait_ms:
        description: "Milliseconds to observe browser-generated requests after DOM ready (0-10000)"
        required: false
        default: "3000"
        type: string

permissions:
  contents: read

jobs:
  passive-origin-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYDRA_TARGET_URL: ${{ inputs.target_url }}
      CYDRA_DISCOVERY_SEED_PATH: ${{ inputs.seed_path }}
      CYDRA_BROWSER_WAIT_MS: ${{ inputs.wait_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install chromium
      - name: Observe anonymous browser API origins
        run: python scripts/browser_public_origin_discovery.py
      - name: Upload passive origin report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web2-public-browser-origin
          path: artifacts/public-browser-origin.json
          if-no-files-found: warn
          retention-days: 30