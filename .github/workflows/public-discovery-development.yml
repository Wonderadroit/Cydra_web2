name: Web2 public discovery development

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Explicitly authorized target base URL"
        required: true
        default: "https://app.aurory.io"
        type: string
      discovery_seeds:
        description: "Comma-separated in-scope seed paths"
        required: false
        default: "/"
        type: string
      max_paths:
        description: "Maximum paths to explore"
        required: false
        default: "250"
        type: string

permissions:
  contents: read

jobs:
  public-discovery:
    runs-on: ubuntu-latest
    environment: live-dogfood
    env:
      CYDRA_TARGET_URL: ${{ inputs.target_url || 'https://app.aurory.io' }}
      CYDRA_DISCOVERY_SEEDS: ${{ inputs.discovery_seeds || '/' }}
      CYDRA_MAX_PATHS: ${{ inputs.max_paths || '250' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run anonymous public discovery
        run: python scripts/public_discovery.py
      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web2-public-discovery
          path: artifacts/public-discovery.json
          if-no-files-found: warn
