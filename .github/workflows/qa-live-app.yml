name: CYDRA authorized live-app QA

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Exact public HTTPS page URL you are authorized to test
        required: true
        type: string
      authorization_confirmed:
        description: Confirm you own this application or have explicit permission to test it
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-app-smoke-qa:
    if: ${{ inputs.authorization_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and PDF dependencies
        timeout-minutes: 5
        run: |
          python -m pip install -e ".[browser,report]"
          python -m playwright install --with-deps chromium
      - name: Run bounded read-only live application QA
        env:
          CYDRA_QA_TARGET_URL: ${{ inputs.target_url }}
          CYDRA_QA_OUT: artifacts/live-app-qa
        run: python scripts/qa_live_app.py
      - name: Render customer-readable PDF report
        if: always()
        run: |
          if [ -f artifacts/live-app-qa/report.json ]; then
            python scripts/qa_report_pdf.py --input artifacts/live-app-qa/report.json --output artifacts/live-app-qa/report.pdf
          fi
      - name: Upload live QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-live-app-qa
          path: artifacts/live-app-qa/
          if-no-files-found: warn
          retention-days: 30
