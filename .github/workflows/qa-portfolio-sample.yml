name: CYDRA QA portfolio sample

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  website-qa-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Run desktop and mobile-emulated functional checks
        shell: bash
        run: |
          # The public demo occasionally returns a Heroku 503. Retry the entire
          # evidence run a bounded number of times, but never turn failed assertions
          # into success: only an actual zero exit from the QA runner passes this job.
          for attempt in 1 2 3; do
            echo "QA attempt ${attempt}/3"
            rm -rf artifacts/qa-portfolio
            if python scripts/qa_portfolio_sample.py; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "QA attempt failed; retrying against the public demo."
              sleep 5
            fi
          done
          echo "All three QA attempts failed; preserving the final attempt's evidence."
          exit 1
      - name: Upload report, JSON observations, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-qa-portfolio-sample
          path: artifacts/qa-portfolio/
          if-no-files-found: warn
          retention-days: 30
