name: CYDRA QA portfolio sample

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  website-qa-portfolio:
    # A fresh hosted VM and Chromium process per viewport prevents one viewport's
    # renderer lifecycle from contaminating the next viewport's evidence.
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        timeout-minutes: 5
        run: |
          python -m pip install -e ".[browser]"
          # Use the pre-provisioned Ubuntu browser libraries; avoid apt dependency
          # installation here, which can stall independently of the QA runner.
          python -m playwright install chromium
      - name: Run ${{ matrix.viewport }} functional checks
        timeout-minutes: 5
        env:
          CYDRA_QA_VIEWPORT: ${{ matrix.viewport }}
        run: python scripts/qa_portfolio_sample.py
      - name: Upload report, JSON observations, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-qa-portfolio-sample-${{ matrix.viewport }}
          path: artifacts/qa-portfolio/
          if-no-files-found: warn
          retention-days: 30
