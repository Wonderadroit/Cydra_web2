name: CYDRA QA portfolio sample

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  website-qa-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser automation
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Run desktop and narrow-viewport functional checks
        run: python scripts/qa_portfolio_sample.py
      - name: Upload report, JSON observations, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-qa-portfolio-sample
          path: artifacts/qa-portfolio/
          if-no-files-found: warn
          retention-days: 30
