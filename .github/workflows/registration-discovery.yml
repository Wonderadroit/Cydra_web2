name: Web2 registration surface discovery

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Explicitly authorized HTTPS target base URL"
        required: true
        default: "https://app.aurory.io"
        type: string

permissions:
  contents: read

jobs:
  discover-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-dogfood
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Discover registration links and form schema (read-only)
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python scripts/registration_discovery.py --target-url "$TARGET_URL"
      - name: Upload sanitized discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-registration-discovery
          path: artifacts/registration-discovery.json
          if-no-files-found: warn
